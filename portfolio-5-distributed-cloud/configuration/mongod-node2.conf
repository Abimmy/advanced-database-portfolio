# MikePay Portfolio 5 - replica set member 2 of 3 (mikepay-rs). Local coursework setup, NOT production:
# no authentication, no TLS, all three members on one machine (so no protection against losing the machine).
storage:
  dbPath: C:/xampp/htdocs/Adewusi_Michael_301920446/portfolio-5-distributed-cloud/mongo-data/node2/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1              # the default would let each of the 3 nodes claim about half of the 32 GB RAM
systemLog:
  destination: file
  path: C:/xampp/htdocs/Adewusi_Michael_301920446/portfolio-5-distributed-cloud/mongo-data/node2/mongod.log
  logAppend: true
net:
  port: 27019
  bindIp: 127.0.0.1               # local connections only
replication:
  replSetName: mikepay-rs
  oplogSizeMB: 256                # the default is sized from free disk; a fixed small size is enough here
